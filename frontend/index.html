<!DOCTYPE html>
<html lang="en">
<head>
    <link href="manifest.json" rel="manifest">
    <link href="static/css/style.css" rel="stylesheet">
    <meta content="#ff9900" name="theme-color">
    <meta content="yes" name="apple-mobile-web-app-capable">
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
    <meta content="ED-Cetera" name="apple-mobile-web-app-title">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ED-Cetera // Cockpit HUD</title>
</head>
<body>

<!-- Obere Leiste -->
<div class="system-header">
    SYSTEM: ED-CETERA v1.0
</div>

<!-- Hauptcontainer / Kasten -->
<div id="app" style="width: 100%; display: flex; justify-content: center;">
    <div class="hud-card">
        <h2 class="card-title">STANDBY</h2>
        <div class="hud-row">CMDR: <span>Warte auf Daten...</span></div>
        <div class="hud-row">Ship Name: <span>Unbenannt</span></div>
        <div class="hud-row">Credits: <span>--- CR</span></div>
        <div class="status-badge">STATUS: ONLINE</div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('Service Worker registered successfully.'))
            .catch((err) => console.log('Service Worker registration failed:', err));
    }
</script>

<!-- Lädt app.js dynamisch mit Versions-Parameter gegen Caching-Probleme -->
<script>
    (async function () {
        try {
            let res = await fetch('/api/version');
            let data = await res.json();
            let v = data.version || '1.0.0';

            const script = document.createElement('script');
            script.src = `/static/js/app.js?v=${v}`;
            document.body.appendChild(script);
        } catch (e) {
            console.error("Konnte app.js mit Version nicht laden, nutze Fallback:", e);
            // Fallback ohne Version, falls der Server-Endpunkt mal hakt
            const script = document.createElement('script');
            script.src = "/static/js/app.js";
            document.body.appendChild(script);
        }
    })();
</script>

</body>
</html>
