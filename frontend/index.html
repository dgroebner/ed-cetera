<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9900">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ED-Cetera">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED-Cetera // Cockpit HUD</title>
    <style>
        :root {
            --bg-color: #050b14;
            --hud-orange: #ff9900;
            --hud-dim: rgba(255, 153, 0, 0.3);
            --text-glow: 0 0 10px rgba(255, 153, 0, 0.4);
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--hud-orange);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            /* Subtiles technisches Hintergrund-Raster */
            background-image:
                    linear-gradient(rgba(255, 153, 0, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 153, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Obere System-Leiste im Design des Screenshots */
        .system-header {
            width: 100%;
            max-width: 500px;
            border-top: 2px solid var(--hud-orange);
            border-right: 2px solid var(--hud-orange);
            padding: 5px 15px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            position: relative;
            box-shadow: var(--text-glow);
        }
        .system-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 30px;
            border-bottom: 2px solid var(--hud-orange);
        }

        /* Der untere Inhaltskasten mit dem typischen orangen Rahmen */
        .hud-card {
            width: 100%;
            max-width: 500px;
            border: 2px solid var(--hud-orange);
            padding: 25px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(255, 153, 0, 0.1), var(--text-glow);
            background-color: rgba(5, 11, 20, 0.85);
            box-sizing: border-box;
        }

        /* Kleine Ecke oben links am Kasten wie im Design */
        .hud-card::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            width: 15px;
            height: 4px;
            background-color: var(--hud-orange);
        }

        .card-title {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: var(--text-glow);
            border-bottom: 1px dashed var(--hud-dim);
            padding-bottom: 10px;
        }

        .hud-row {
            font-size: 1rem;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .hud-row span {
            color: #ffb733;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 12px;
            font-size: 0.85rem;
            border: 1px dashed var(--hud-orange);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<!-- Obere Leiste -->
<div class="system-header">
    SYSTEM: ED-CETERA v1.0
</div>

<!-- Hauptcontainer / Kasten -->
<div id="app" style="width: 100%; display: flex; justify-content: center;">
    <div class="hud-card">
        <h2 class="card-title">STANDBY</h2>
        <div class="hud-row">CMDR: <span>Warte auf Daten...</span></div>
        <div class="hud-row">Ship Name: <span>Unbenannt</span></div>
        <div class="hud-row">Credits: <span>--- CR</span></div>
        <div class="status-badge">STATUS: ONLINE</div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('Service Worker registered successfully.'))
            .catch((err) => console.log('Service Worker registration failed:', err));
    }
</script>

<script src="static/js/uiController.js?v=1.0.9"></script>
<script src="static/js/dispatcher.js?v=1.0.9"></script>

<script>
    const ui = new UIController();
    const dispatcher = new EliteJournalDispatcher(ui);

    let lastEventId = 0;

    async function initStatus() {
        try {
            let statusRes = await fetch('/api/status');
            let statusData = await statusRes.json();

            if (statusData.last_id) {
                lastEventId = statusData.last_id;
            }

            let loadGameRes = await fetch('/api/last_loadgame');
            let loadGameData = await loadGameRes.json();

            if (loadGameData.data) {
                dispatcher.handleLine(loadGameData.data);
            }
        } catch (e) {
            console.log("Fehler bei der Initialisierung:", e);
        }
    }

    async function pollEvents() {
        try {
            let response = await fetch(`/api/events/since/${lastEventId}`);
            let result = await response.json();

            if (result.events && result.events.length > 0) {
                for (const item of result.events) {
                    lastEventId = item.id;
                    dispatcher.handleLine(item.data);
                }
            }
        } catch (e) {
            console.log("Fehler beim Event-Polling:", e);
        }
    }

    initStatus().then(() => {
        setInterval(pollEvents, 2000);
    });
</script>

</body>
</html>
